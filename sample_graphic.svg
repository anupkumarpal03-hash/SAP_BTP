<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Sample Graphic</title>
  <desc id="desc">A colorful sample bar chart with labels and axes.</desc>

  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- Chart area -->
  <rect x="70" y="40" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>

  <!-- Grid lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="300" x2="640" y2="300"/>
    <line x1="100" y1="245" x2="640" y2="245"/>
    <line x1="100" y1="190" x2="640" y2="190"/>
    <line x1="100" y1="135" x2="640" y2="135"/>
    <line x1="100" y1="80" x2="640" y2="80"/>
  </g>

  <!-- Axes -->
  <g stroke="#334155" stroke-width="2">
    <line x1="100" y1="80" x2="100" y2="300"/>
    <line x1="100" y1="300" x2="640" y2="300"/>
  </g>

  <!-- Bars -->
  <g>
    <rect x="145" y="180" width="70" height="120" fill="#3b82f6" rx="5"/>
    <rect x="255" y="130" width="70" height="170" fill="#22c55e" rx="5"/>
    <rect x="365" y="100" width="70" height="200" fill="#f59e0b" rx="5"/>
    <rect x="475" y="160" width="70" height="140" fill="#ef4444" rx="5"/>
  </g>

  <!-- X labels -->
  <g fill="#0f172a" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="180" y="330">Q1</text>
    <text x="290" y="330">Q2</text>
    <text x="400" y="330">Q3</text>
    <text x="510" y="330">Q4</text>
  </g>

  <!-- Y labels -->
  <g fill="#475569" font-size="13" font-family="Arial, Helvetica, sans-serif" text-anchor="end">
    <text x="92" y="304">0</text>
    <text x="92" y="249">25</text>
    <text x="92" y="194">50</text>
    <text x="92" y="139">75</text>
    <text x="92" y="84">100</text>
  </g>

  <!-- Title -->
  <text x="360" y="65" fill="#0f172a" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">
    Sample Graphic (Bar Chart)
  </text>
</svg>
